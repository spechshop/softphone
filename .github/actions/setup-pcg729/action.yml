name: Setup latest pcg729 PHP runtime
description: Downloads and validates the selected pcg729 php-xmlwriter release asset
inputs:
  release:
    description: Stable, prerelease, or an exact release tag
    required: false
    default: stable
runs:
  using: composite
  steps:
    - shell: bash
      env:
        GH_TOKEN: ${{ github.token }}
        PCG729_RELEASE: ${{ inputs.release }}
      run: bash .github/scripts/install-pcg729.sh
