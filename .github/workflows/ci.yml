name: SpechPhone CI
on:
  pull_request:
    branches: [inbound]
  push:
    branches: [inbound]
  workflow_dispatch:
    inputs:
      pcg729_release:
        description: stable, prerelease, or an exact pcg729 tag
        required: false
        default: stable
        type: string
permissions:
  contents: read
jobs:
  php-syntax:
    name: PHP Syntax
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with: {submodules: recursive}
      - uses: ./.github/actions/setup-pcg729
        with:
          release: ${{ inputs.pcg729_release || 'stable' }}
      - name: Lint PHP files with pcg729
        shell: bash
        run: |
          set -euo pipefail
          while IFS= read -r -d '' file; do "$PCG729_PHP" -l "$file"; done < <(find . -type f -name '*.php' -not -path './.git/*' -not -path './vendor/*' -not -path './*/vendor/*' -not -path './*/stubs/*' -print0)
  javascript-syntax:
    name: JavaScript Syntax
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: 22}
      - name: Check project JavaScript
        shell: bash
        run: |
          set -euo pipefail
          mapfile -d '' files < <(find plugins js -type f \( -name '*.js' -o -name '*.mjs' \) -print0)
          ((${#files[@]} > 0))
          for file in "${files[@]}"; do node --check "$file"; done
  unit-tests:
    name: Unit Tests
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with: {submodules: recursive}
      - uses: ./.github/actions/setup-pcg729
        with:
          release: ${{ inputs.pcg729_release || 'stable' }}
      - name: Run unit and isolation suites
        shell: bash
        run: |
          set -euo pipefail
          for test in tests/SipRegisterManagerTest.php tests/RegistrarRetryPolicyTest.php tests/AccountMessagingIsolationTest.php tests/CallStateBindingTest.php tests/WebPushStorageTest.php tests/WebPushTlsTest.php tests/SpechphoneVaultFailureTest.php tests/IdentityStressTest.php; do
            echo "=== $test ==="
            "$PCG729_PHP" "$test"
          done
  sip-integration:
    name: SIP Integration
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with: {submodules: recursive}
      - uses: ./.github/actions/setup-pcg729
        with:
          release: ${{ inputs.pcg729_release || 'stable' }}
      - name: Run isolated UDP SIP lab
        run: "$PCG729_PHP tests/udp_sip_lab.php"
  regression-tests:
    name: Regression Tests
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with: {submodules: recursive}
      - uses: ./.github/actions/setup-pcg729
        with:
          release: ${{ inputs.pcg729_release || 'stable' }}
      - name: Run retry and media regressions
        shell: bash
        run: |
          set -euo pipefail
          for test in tests/RegistrarRetryPolicyTest.php tests/PhoneControllerOutboundTest.php tests/SipMessageBodyTest.php tests/OpusSupportTest.php tests/OpusOutboundNegotiationTest.php tests/MicUplinkPipelineTest.php; do
            echo "=== $test ==="
            "$PCG729_PHP" "$test"
          done
  frontend-tests:
    name: Frontend Tests
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: 22}
      - name: Run isolated frontend regression scripts
        shell: bash
        run: |
          set -euo pipefail
          for test in tests/frontend_logout_test.mjs tests/frontend_message_identity_test.mjs tests/frontend_inbound_hangup_lifecycle_test.mjs tests/frontend_push_retry_test.mjs; do
            echo "=== $test ==="
            node "$test"
          done
  security-checks:
    name: Security Checks
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with: {submodules: recursive}
      - uses: ./.github/actions/setup-pcg729
        with:
          release: ${{ inputs.pcg729_release || 'stable' }}
      - name: Check for committed secrets and unsafe retry paths
        shell: bash
        run: |
          set -euo pipefail
          if rg -n --hidden -g '!.git/**' -g '!*.lock' '(AKIA[0-9A-Z]{16}|-----BEGIN (RSA |EC |OPENSSH )?PRIVATE KEY-----|SPECH_VAULT_KEY_HEX\s*=\s*[0-9a-fA-F]{64})' .; then
            echo 'Potential committed secret found' >&2; exit 1
          fi
          rg -q 'SipRegisterManager::handleResponse\(\$parse, \$info\)' server.php
          "$PCG729_PHP" tests/RegistrarRetryPolicyTest.php
          "$PCG729_PHP" tests/AccountMessagingIsolationTest.php
  stress-tests:
    name: Stress Tests
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with: {submodules: recursive}
      - uses: ./.github/actions/setup-pcg729
        with:
          release: ${{ inputs.pcg729_release || 'stable' }}
      - name: Run bounded local UDP registration stress suite
        run: "$PCG729_PHP tests/udp_sip_stress.php"
