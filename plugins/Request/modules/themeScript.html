    function hexToRgb(hex) {
        hex = hex.replace('#', '');
        if (hex.length === 3) {
            hex = hex.split('').map(c => c + c).join('');
        }
        const num = parseInt(hex, 16);
        return {
            r: (num >> 16) & 255,
            g: (num >> 8) & 255,
            b: num & 255
        };
    }

    function rgbStringToRgb(str) {
        const m = str.match(/rgba?\(([^)]+)\)/);
        if (!m) return null;
        const parts = m[1].split(',').map(v => v.trim());
        return {
            r: parseInt(parts[0]),
            g: parseInt(parts[1]),
            b: parseInt(parts[2])
        };
    }

    function deriveGlow(color, alpha = 0.15, boost = 1.15) {
        let rgb;

        if (color.startsWith('#')) {
            rgb = hexToRgb(color);
        } else if (color.startsWith('rgb')) {
            rgb = rgbStringToRgb(color);
        }

        if (!rgb) return 'transparent';

        const brighten = (v) => Math.min(255, Math.floor(v * boost));

        return `rgba(${brighten(rgb.r)}, ${brighten(rgb.g)}, ${brighten(rgb.b)}, ${alpha})`;
    }

        function applyTheme(themeName) {
            const theme = themes[themeName];
            if (!theme) return;

            theme.colors['--glow-1'] = deriveGlow(theme.colors['--accent']);
            theme.colors['--glow-2'] = deriveGlow(theme.colors['--accent'], 0.2, 0.5);

            // Remove estilo anterior se existir
            if (themeStyleElement) {
                themeStyleElement.remove();
            }

            // Cria novo elemento de estilo com regras CSS importantes
            themeStyleElement = document.createElement('style');
            themeStyleElement.id = 'dynamic-theme-style';
            themeStyleElement.innerHTML = generateThemeCSS(theme);
            document.head.appendChild(themeStyleElement);

            // Atualiza gráficos ApexCharts existentes
            if (typeof ApexCharts !== 'undefined' && window.Apex) {
                setTimeout(() => {
                    const charts = document.querySelectorAll('.apexcharts-canvas');
                    charts.forEach(chart => {
                        const chartId = chart.getAttribute('data-apex-chart-id');
                        if (chartId && ApexCharts.exec) {
                            try {
                                ApexCharts.exec(chartId, 'updateOptions', {
                                    chart: {
                                        background: 'transparent',
                                        foreColor: theme.colors['--text']
                                    },
                                    theme: {
                                        mode: 'dark'
                                    },
                                    grid: {
                                        borderColor: theme.colors['--card-bg']
                                    },
                                    tooltip: {
                                        theme: 'dark',
                                        style: {
                                            background: theme.colors['--secondary-bg']
                                        }
                                    }
                                }, false, false);
                            } catch (e) {
                                console.log('Chart update skipped:', e);
                            }
                        }
                    });
                }, 100);
            }

            localStorage.setItem('selectedTheme', themeName);
            currentTheme = themeName;
        }

        function loadCustomThemes() {
            const customThemes = localStorage.getItem('customThemes');
            if (customThemes) {
                try {
                    const parsed = JSON.parse(customThemes);
                    Object.assign(themes, parsed);
                } catch (e) {
                    console.error('Erro ao carregar temas customizados:', e);
                }
            }
        }

        function saveCustomTheme(key, theme) {
            const customThemes = JSON.parse(localStorage.getItem('customThemes') || '{}');
            customThemes[key] = theme;
            localStorage.setItem('customThemes', JSON.stringify(customThemes));
            themes[key] = theme;
        }

        function deleteCustomTheme(key) {
            const customThemes = JSON.parse(localStorage.getItem('customThemes') || '{}');
            delete customThemes[key];
            delete themes[key];
            localStorage.setItem('customThemes', JSON.stringify(customThemes));
        }

    function isVisible(el) {
        const selectElement = el instanceof HTMLElement ? el : document.querySelector(el);
        try {
            return selectElement && selectElement.offsetWidth > 0 && selectElement.offsetHeight > 0;
        } catch {
            return false;
        }
    }

    /**
     * Aguarda um elemento ficar visível na DOM
     * @param {string} el
     * @param {number} timeout Tempo máximo em ms
     * @param {number} interval Intervalo de checagem (default 100ms)
     * @returns {Promise<HTMLElement>}
     */
    function waitVisible(el, timeout = 5000, interval = 100) {
        return new Promise((resolve, reject) => {
            const start = Date.now();

            (function check() {
                if (isVisible(el)) {
                    return resolve(el);
                }

                if (Date.now() - start >= timeout) {
                    return reject(new Error('Elemento não visível'));
                }

                setTimeout(check, interval);
            })();
        });
    }
